# Basic checks on every push: everything compiles, the unit tests pass, a freshly built lomod
# starts and serves the first-run setup page, and the Windows one-line installer survives
# being run twice. scripts/release-all.sh refuses to release a commit this workflow hasn't
# passed -- note that this now includes the installer job, so an outage at lomorage.com or
# GitHub Releases blocks releasing until it clears (SKIP_CI_CHECK=1 is the documented
# override).
#
# Not run here: the handler package's gocheck suite (TestMainSuite -- needs mDNS, fixed /tmp
# paths and sample media) and api/test/lomod (needs an installed lomod); see `make test-handler`
# and `make test-api`.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GOFLAGS: -mod=vendor
  CGO_ENABLED: "1"
  CGO_CFLAGS_ALLOW: -Xpreprocessor
  TAGS: sqlite_trace trace

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false # dependencies are vendored

      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvips-dev libimage-exiftool-perl ffmpeg zbar-tools samba

      - name: Embed web assets with go.rice, as release builds do
        run: |
          GOFLAGS= go install github.com/GeertJohan/go.rice/rice@v1.0.2
          make build-rice

      - name: Build everything
        run: go build -tags "$TAGS" ./...

      - name: Unit tests
        # Same package set as `make test-simple`.
        run: |
          go list ./... | grep -vE 'api|cmd|handler|vendor' \
            | xargs go test -tags "$TAGS" -timeout 20m

      - name: Handler unit tests (without the gocheck suite)
        run: go test -tags "$TAGS" -timeout 10m -skip '^TestMainSuite$' ./handler/

      - name: lomoupg self-update tests
        # cmd/ is excluded from the unit test step above. The Windows-only cases (a locked
        # install dir) skip here; scripts/windows/test-self-update.ps1 covers those end to end.
        run: CGO_ENABLED=0 go test -timeout 5m ./cmd/lomoupg/

      - name: Build lomod
        # -s -w like the release build (scripts/cross-build-rpi/build.sh). Also required: an
        # unstripped Linux binary panics in go.rice's init, because the vendored go.zipexe v1.0.0
        # calls ReadAt on DWARF sections Go now compresses, which debug/elf can't read directly.
        run: go build -tags "$TAGS" -ldflags "-s -w" -o bin/lomod ./cmd/lomod

      - name: Smoke test the first-run setup page
        run: bash scripts/ci/smoke-setup-qr.sh bin/lomod

      - name: Keep the lomod binary for the test image
        uses: actions/upload-artifact@v7
        with:
          name: lomod-linux-amd64
          path: bin/lomod
          retention-days: 7

  # Installs lomod twice on a real Windows host. A reinstall is the documented repair/update
  # path, and the bug that prompted this job was invisible to everything above: Register-
  # ScheduledTask only failed with ResourceExists (0x800700b7) on the *second* run, on a machine
  # with a Task Scheduler, and the installer's own try/catch turned that into a warning -- so a
  # reinstall silently ended up with no daily update check.
  #
  # Runs under Windows PowerShell 5.1, which is what `irm https://lomorage.com/windows/install.ps1
  # | iex` gets on a stock Windows box. Installs the *published* release (lomorage.com/release.json
  # -> GitHub Releases), not this commit's build: the installer script is what's under test here,
  # so this job needs both of those reachable.
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: First install
        shell: powershell
        run: |
          # A child powershell.exe, so the installer's own `exit 1` is observable rather than
          # taking this step's shell down with it.
          & powershell.exe -NoProfile -File .\installers\windows\install.ps1 -NoBrowser *>&1 |
            Tee-Object -FilePath run1.log
          "install.ps1 exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "first install failed (exit $LASTEXITCODE)" }

      - name: Second install, over the first
        shell: powershell
        run: |
          & powershell.exe -NoProfile -File .\installers\windows\install.ps1 -NoBrowser *>&1 |
            Tee-Object -FilePath run2.log
          "install.ps1 exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "second install failed (exit $LASTEXITCODE)" }

      - name: Check what the second run left behind
        shell: powershell
        run: |
          $failures = 0
          function Ok($m)  { Write-Host "  PASS  $m" }
          function Bad($m) { Write-Host "  FAIL  $m"; $script:failures++ }

          $run2 = Get-Content run2.log -Raw

          # The regression itself.
          if ($run2 -match '0x800700b7|ResourceExists|already exists') {
            Bad "second run still hit a task-already-exists error"
          } else { Ok "no ResourceExists error on the re-run" }

          if ($run2 -match 'Could not register the auto-update Scheduled Task') {
            Bad "second run could not register the auto-update task"
          } else { Ok "auto-update task registered on the re-run" }

          if ($run2 -match 'daily auto-update check: enabled') {
            Ok "summary reports the auto-update check as enabled"
          } else { Bad "summary did not report the auto-update check as enabled" }

          # State, not just output.
          $tasks = @(Get-ScheduledTask -TaskName LomorageUpdate -ErrorAction SilentlyContinue)
          if ($tasks.Count -eq 1) { Ok "exactly one LomorageUpdate task" } else { Bad "$($tasks.Count) LomorageUpdate tasks" }
          if ($tasks.Count -ge 1) {
            $t = $tasks[0]
            if (@($t.Triggers)[0].StartBoundary -like '*T03:15:00*') { Ok "trigger intact: daily 03:15" } else { Bad "trigger: $(@($t.Triggers)[0].StartBoundary)" }
            if ($t.Principal.RunLevel -eq 'Limited') { Ok "RunLevel intact: Limited" } else { Bad "RunLevel: $($t.Principal.RunLevel)" }
          }

          foreach ($pair in @(
            @{ name = 'Startup shortcut';    path = (Join-Path ([Environment]::GetFolderPath('Startup')) 'Lomorage.lnk') },
            @{ name = 'Start Menu shortcut'; path = (Join-Path ([Environment]::GetFolderPath('Programs')) 'Lomorage.lnk') },
            @{ name = 'version.txt';         path = (Join-Path $env:LOCALAPPDATA 'Lomorage\lomod\version.txt') },
            @{ name = 'lomod.exe';           path = (Join-Path $env:LOCALAPPDATA 'Lomorage\lomod\lomod.exe') }
          )) {
            if (Test-Path $pair.path) { Ok "$($pair.name) present" } else { Bad "$($pair.name) missing: $($pair.path)" }
          }

          # Only one shortcut per folder, not one per install.
          foreach ($folder in 'Startup', 'Programs') {
            $lnks = @(Get-ChildItem ([Environment]::GetFolderPath($folder)) -Filter 'Lomorage*.lnk' -ErrorAction SilentlyContinue)
            if ($lnks.Count -eq 1) { Ok "$folder has exactly one Lomorage shortcut" } else { Bad "$folder has $($lnks.Count)" }
          }

          # No leftover installer zip in %TEMP% -- the cleanup still runs, it is just non-fatal now.
          $zips = @(Get-ChildItem $env:TEMP -Filter 'lomorage-windows-*.zip' -ErrorAction SilentlyContinue)
          if ($zips.Count -eq 0) { Ok "temp zip cleaned up" } else { Bad "$($zips.Count) leftover zip(s) in TEMP" }

          Write-Host ""
          if ($failures -gt 0) { throw "$failures check(s) failed" }
          Write-Host "re-run is clean"

      - name: Installer output, both runs
        if: always()
        shell: powershell
        run: |
          foreach ($f in 'run1.log', 'run2.log') {
            Write-Host "===== $f ====="
            if (Test-Path $f) { Get-Content $f } else { Write-Host "(missing)" }
            Write-Host ""
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-logs
          path: run*.log
          if-no-files-found: warn

  # Publishes ghcr.io/lomorage/lomod-test: this commit's lomod plus its runtime
  # dependencies, for other repos' integration tests (lomo-mobile's `integration`
  # job runs inside it). Tags: branch name, sha-<commit>, and `latest` on main.
  publish-test-image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lomod-linux-amd64
          path: dockerfiles/lomod-test

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lomorage/lomod-test
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: dockerfiles/lomod-test
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
