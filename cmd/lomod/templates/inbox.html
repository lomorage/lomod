<!DOCTYPE html>

<html lang="en">
  <head>
    <!-- Force latest IE rendering engine or ChromeFrame if installed -->
    <!--[if IE]>
      <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <![endif]-->
    <meta charset="utf-8" />
    <title>{{gettext "Inbox"}}</title>
    <meta name="description" content="Inbox of Lomorage"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="static/lomo/img/favicon.ico?v=memory-embrace-1" type="image/x-icon" />
    <!-- Bootstrap styles -->
    <link href="static/bootstrap-3.3.7/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="static/lomo/css/theme.css?v=memory-style-1">
    <link rel="stylesheet" type="text/css" href="static/lomo/css/gallery.css?v=memory-style-1">
    <!-- blueimp Gallery styles -->
    <link rel="stylesheet" href="static/blueimp-gallery/css/blueimp-gallery.min.css"/>
    <script src="static/polyglot/polyglot.min.js"></script>
    <script src="static/lomo/js/i18n.js"></script>
  </head>
  <body class="lomo-app page-inbox">
    <nav class="lomo-navbar">
      <div class="lomo-navbar-inner">
        <a class="lomo-brand" href="https://lomorage.com">
          <img src="static/lomo/img/logo-64.png?v=memory-embrace-1" alt="" class="lomo-brand-mark">
          <span class="lomo-brand-word">lomorage</span>
        </a>
        <button type="button" class="lomo-navbar-toggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <ul class="lomo-navbar-links">
          <li><a href="/gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>{{gettext "Gallery"}}</a></li>
          <li><a href="/import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>{{gettext "Upload"}}</a></li>
          <li><a href="/inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>{{gettext "Inbox"}}</a></li>
          <li><a href="/localimport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>{{gettext "Local Import"}}</a></li>
          <li><a href="/users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>{{gettext "Users"}}</a></li>
          <li><a href="#" id="logout" class="lomo-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>{{gettext "Logout"}}</a></li>
        </ul>
      </div>
      <div class="lomo-navbar-backdrop"></div>
    </nav>
    <div class="lomo-page-head">
      <h1>{{gettext "Inbox"}}</h1>
    </div>
    <!-- The blueimp Gallery widget -->
    <div id="blueimp-gallery" class="blueimp-gallery blueimp-gallery-controls">
      <div class="slides"></div>
      <h3 class="title"></h3>
      <a class="prev">‹</a>
      <a class="next">›</a>
      <a class="close">×</a>
      <a class="play-pause"></a>
    </div>

    <script src="static/jquery/jquery.min.js"></script>
    <!-- The jQuery UI widget factory, can be omitted if jQuery UI is already included -->
    <script src="static/jquery/jquery.ui.widget.js"></script>
    <script src="static/lomo/js/nav.js"></script>
    <!-- blueimp Gallery script -->

    <script src="static/heic2any/heic2any.min.js"></script>
    <!-- <script src="https://cdn.apple-livephotoskit.com/lpk/1/livephotoskit.js"></script> -->
    <script src="static/laphs/laphs.js"></script>
    <script src="static/zip/zip.js"></script>
    <script src="static/zip/zip-ext.js"></script>

    <script src="static/blueimp-gallery/js/blueimp-helper.js"></script>
    <script src="static/blueimp-gallery/js/blueimp-gallery.js"></script>
    <script src="static/blueimp-gallery/js/blueimp-gallery-fullscreen.js"></script>
    <script src="static/blueimp-gallery/js/blueimp-gallery-indicator.js"></script>
    <script src="static/blueimp-gallery/js/blueimp-gallery-video.js"></script>
    <script src="static/blueimp-gallery/js/blueimp-gallery-livephoto.js"></script>
    <script src="static/blueimp-gallery/js/jquery.blueimp-gallery.js"></script>
    <!-- ...
    <script src="static/blueimp-gallery/js/jquery.blueimp-gallery.min.js"></script>
    -->

    <!--<script src="static/js/jquery.lazy.min.js"></script>-->

    <!-- The main application script -->
    <script src="static/lomo/js/conf.js"></script>
    <script src="static/lomo/js/inbox.js"></script>


    <div id="links">
    </div>

    <center style="padding: 0;margin:0;list-style: none">
        {{.Foot}}
    </center>
  </body>
</html>
